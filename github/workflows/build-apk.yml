name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generar carpeta android sin tocar mi código
        run: |
          mkdir -p /tmp/bak
          cp -r lib /tmp/bak/lib
          cp pubspec.yaml /tmp/bak/pubspec.yaml
          flutter create --platforms=android --org com.nuestraia --project-name nuestra_ia .
          rm -rf lib
          cp -r /tmp/bak/lib lib
          cp /tmp/bak/pubspec.yaml pubspec.yaml
          rm -rf test

      - name: Permiso de internet
        run: |
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: nuestra-ia-apk
          path: build/app/outputs/flutter-apk/app-release.apk
